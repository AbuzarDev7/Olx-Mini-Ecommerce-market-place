 </a>

  <!-- Upload Form -->
  <main class="main-content">
    <div class="upload-container">
      <h2>Product Listing </h2>
      <form id="form">
        <div class="input-group">
          <label for="title">product Title</label>
          <input type="text" id="title" name="title" placeholder="e.g., Honda Civic 2020" required />
        </div>

        <div class="input-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Enter car details" required></textarea>
        </div>

        <div class="input-group">
          <label for="price">Price ($)</label>
          <input type="number" id="price" name="price" placeholder="Enter price" required />
        </div>
        <div class="input-group">
          <label>Product Image</label>
          <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <button type="button" id="upload_widget" class="cloudinary-button" style="padding: 12px 18px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: background 0.3s;">
              📁 Select & Upload Image
            </button>
            <input type="file" id="native_file_input" accept="image/*" style="display: none;" />
          </div>
          <div id="image_preview_container" style="margin-top: 12px; display: none;">
            <img id="img_preview" src="" alt="Preview" style="max-width: 180px; max-height: 180px; border-radius: 8px; border: 2px solid #007bff; object-fit: cover;" />
          </div>
          <span id="upload_status" style="margin-top: 8px; font-size: 14px; font-weight: 600; display: none;"></span>
        </div>

        <button type="submit">Create Listing</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>  

  <script type="module" src="./scritp/upload.js"></script>
</body>
</html>
