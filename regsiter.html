<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OLX - Register</title>
<link rel="stylesheet" href="./css/regsiter.css">

</head>
<body>
  <main class="card" role="main" aria-labelledby="signup-title">
    <div class="top">
      <div class="logo">
        <img src="https://logos-world.net/wp-content/uploads/2022/04/OLX-Symbol.png" alt="OLX Logo">
      </div>
      <div>
        <h1 id="signup-title" class="heading">Create your account</h1>
        <div class="subtitle">Join OLX — buy & sell in your city</div>
      </div>
    </div>

 
    <form aria-label="Create account form" id="form">
          <div class="field">
        <label for="fullname">Full name</label>
        <input id="fullname" type="text" placeholder="e.g. Ali Khan" />
      </div>

      <div class="field">
        <label for="email">Email or Phone</label>
        <input id="inpEmail" type="text" placeholder="you@example.com or 03xx-xxxxxxx" />
      </div>

      <div class="row">
        <div class="field half">
          <label for="password">Password</label>
          <input id="inpPassword" type="password" placeholder="Enter your password" />
        </div>
        
      </div>
       <div class="input-group" style="margin-bottom: 18px;">
        <label style="margin-bottom: 6px; font-weight: 600; display: block;">Profile Picture</label>
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
          <button type="button" id="upload_widget" class="cloudinary-button" style="width: 100%; padding: 12px 18px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: background 0.3s;">
            📷 Select Profile Picture
          </button>
          <input type="file" id="native_file_input" accept="image/*" style="display: none;" />
        </div>
        <div id="image_preview_container" style="margin-top: 10px; text-align: center; display: none;">
          <img id="img_preview" src="" alt="Preview" style="width: 90px; height: 90px; border-radius: 50%; border: 3px solid #007bff; object-fit: cover; display: inline-block;" />
        </div>
        <span id="upload_status" style="margin-top: 8px; font-size: 14px; font-weight: 600; display: none;"></span>
      </div>

      <button type="submit" class="btn">Create Account</button>
    </form>
  </main>

  <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>  
  <script type="module" src="./scritp/regester.js"></script>
</body>
</html>
